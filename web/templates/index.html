<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-text">
      <h1>Media Downloader</h1>
      <p class="subtitle">Paste a link from any site yt-dlp supports.</p>
    </div>
    <button type="button" id="stop-app-btn" class="stop-app" title="Shut down the Media Downloader app">Stop app</button>
  </header>

  <section class="card stopped-card" id="stopped-card" hidden>
    <h2>Media Downloader has stopped</h2>
    <p>You can close this tab. To use it again, start the app again.</p>
  </section>

  <main>
    <section class="card" id="analyze-card">
      <form id="analyze-form">
        <label for="url-input">Video or playlist URL</label>
        <div class="row">
          <input id="url-input" type="url" placeholder="https://…" required autocomplete="off">
          <button type="submit" id="analyze-btn">Analyze</button>
        </div>
      </form>
      <p class="error" id="analyze-error" hidden></p>
    </section>

    <section class="card" id="configure-card" hidden>
      <div class="preview">
        <img id="preview-thumb" alt="" hidden>
        <div class="preview-info">
          <h2 id="preview-title"></h2>
          <p class="meta">
            <span id="preview-site" class="badge"></span>
            <span id="preview-count"></span>
            <span id="preview-duration"></span>
          </p>
          <p class="warning" id="preview-warning" hidden></p>
        </div>
      </div>

      <form id="job-form">
        <div class="field">
          <label for="quality-select">Quality</label>
          <select id="quality-select"></select>
        </div>
        <div class="field">
          <label for="naming-select">File naming</label>
          <select id="naming-select">
            <option value="original">Original title</option>
            <option value="numbered">Sequential numbering</option>
          </select>
        </div>
        <div class="field">
          <label>Subtitles</label>
          <div id="subtitle-options" class="subtitle-options"></div>
          <input
            id="subtitle-langs-input"
            type="text"
            placeholder="Language codes, comma-separated (e.g. en,es)"
            autocomplete="off"
            hidden
          >
          <label class="checkbox-row">
            <input type="checkbox" id="subtitles-only-checkbox">
            Subtitles only (skip video/audio)
          </label>
        </div>
        <div class="field">
          <label for="destination-input">Destination folder</label>
          <div class="row">
            <input id="destination-input" type="text" placeholder="/path/to/folder" autocomplete="off">
            <button type="button" id="browse-btn">Browse…</button>
          </div>
        </div>
        <div class="field">
          <label for="existing-select">If a file already exists</label>
          <select id="existing-select">
            <option value="skip">Skip</option>
            <option value="overwrite">Overwrite</option>
            <option value="ask">Ask me</option>
          </select>
        </div>
        <div class="field">
          <label for="concurrency-input">Playlist items in parallel</label>
          <input id="concurrency-input" type="number" min="1" max="8" value="3">
        </div>
        <button type="submit" id="start-btn">Start download</button>
      </form>
      <p class="error" id="job-error" hidden></p>
    </section>

    <dialog class="card browse-panel" id="browse-panel">
      <div class="browse-header">
        <h2>Choose a folder</h2>
        <button type="button" class="icon-btn" id="browse-close">✕</button>
      </div>
      <nav class="breadcrumb" id="browse-breadcrumb"></nav>
      <p class="error" id="browse-error" hidden></p>
      <ul class="browse-list" id="browse-list"></ul>
      <form class="row new-folder-row" id="new-folder-form">
        <input type="text" id="new-folder-name" placeholder="New folder name" autocomplete="off">
        <button type="submit">Create</button>
      </form>
      <button type="button" id="browse-select-btn" class="primary-wide">Use this folder</button>
    </dialog>

    <section class="card" id="jobs-card">
      <h2>Jobs</h2>
      <div id="jobs-list" class="jobs-list">
        <p class="empty" id="jobs-empty">No downloads yet.</p>
      </div>
    </section>
  </main>

  <template id="job-card-template">
    <article class="job">
      <div class="job-body">
        <img class="job-thumb" alt="" hidden>
        <div class="job-main">
          <header class="job-header">
            <span class="job-title"></span>
            <span class="job-state badge"></span>
          </header>
          <div class="job-bar-track">
            <div class="job-bar-fill"></div>
          </div>
          <p class="job-stats"></p>
          <p class="job-error error" hidden></p>
          <div class="job-conflict" hidden>
            <p class="job-conflict-text"></p>
            <div class="row">
              <button type="button" class="job-conflict-skip">Skip</button>
              <button type="button" class="job-conflict-overwrite">Overwrite</button>
            </div>
          </div>
          <ul class="job-files"></ul>
          <button class="job-cancel" type="button">Cancel</button>
        </div>
      </div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
