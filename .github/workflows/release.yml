# Builds the standalone executables on each OS and publishes them.
#
#   - Push a tag like v1.0.0  -> builds all four files and attaches them
#                                to a GitHub Release for that tag.
#   - "Run workflow" (manual) -> builds them and keeps them as workflow
#                                artifacts only (no release).
#
# Each platform is built natively (PyInstaller can't cross-compile), using
# the same build.sh / build.ps1 you'd run locally.
name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # The oldest supported runner, so the binaries also run on
          # older distros (they need a glibc at least as new as the
          # build machine's: Ubuntu 22.04 = glibc 2.35).
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        if: matrix.name == 'linux'
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          BUILD_PYTHON: python
        run: ./build.ps1

      - name: Build (Linux)
        if: matrix.name == 'linux'
        env:
          BUILD_PYTHON: python
        run: ./build.sh linux

      - uses: actions/upload-artifact@v4
        with:
          name: media-downloader-${{ matrix.name }}
          path: dist/${{ matrix.name }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
